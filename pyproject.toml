[project]
name = "storch"
version = "0.2.0"
description = "PyTorch-compatible deep learning + data-science toolkit: fast CPU autograd, SQL/CSV/Parquet data layer, preprocessing, metrics, classical ML, RNN/LSTM/Transformer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["deep-learning", "pytorch", "machine-learning", "data-science", "sql", "numpy", "transformer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
io = ["pandas>=1.5", "pyarrow>=10"]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7", "pandas>=1.5", "pyarrow>=10", "matplotlib>=3.5"]
all = ["pandas>=1.5", "pyarrow>=10", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/salim-studio/storch"
Repository = "https://github.com/salim-studio/storch"
Documentation = "https://github.com/salim-studio/storch#readme"
Issues = "https://github.com/salim-studio/storch/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["storch*", "etorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
