[project]
name = "etorch"
version = "0.1.0"
description = "PyTorch-compatible API, faster on CPU via multithreaded ufuncs, fused ops and in-place updates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/salim-studio/etorch"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etorch*"]
