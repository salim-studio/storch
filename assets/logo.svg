  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="6"/>
  <!-- flame -->
  <path fill="url(#flame)" d="M256 62c8 62-52 84-64 142-9 44 12 84 44 104-6-30-2-52 10-72 4 22 14 34 30 44 26-34 34-66 28-102-8-48-30-84-48-116z"/>
  <path fill="url(#flame)" opacity="0.9" d="M256 150c4 40-34 54-42 92-6 29 8 55 29 68-4-20-1-34 7-47 3 14 9 22 20 29 17-22 22-43 18-67-5-31-19-54-32-75z" opacity="0.55"/>
  <!-- bold S -->
  <text x="256" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="172" fill="#FFFFFF" letter-spacing="-4">S</text>
  <!-- spark accent -->
  <circle cx="392" cy="132" r="14" fill="url(#spark)"/>
  <circle cx="120" cy="392" r="9" fill="url(#spark)" opacity="0.8"/>
