<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="storch banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213B"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1A1033"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- glow -->
  <ellipse cx="200" cy="200" rx="150" ry="150" fill="#F97316" opacity="0.12"/>
  <!-- flame mark -->
  <g transform="translate(120,88)">
    <path fill="url(#flame)" d="M80 8c6 48-40 65-50 110-7 34 9 65 34 81-5-23-2-40 8-56 3 17 11 26 23 34 20-26 26-51 22-79-6-37-23-65-37-90z"/>
    <text x="80" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF">S</text>
  </g>
  <!-- wordmark -->
  <text x="300" y="190" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" fill="url(#word)" letter-spacing="-2">storch</text>
  <text x="302" y="248" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#CBD5E1">From database to deep learning.</text>
  <!-- pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">
    <rect x="302" y="278" width="252" height="44" rx="22" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="428" y="308" text-anchor="middle" fill="#FCD34D">PyTorch-compatible</text>
    <rect x="570" y="278" width="222" height="44" rx="22" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <text x="681" y="308" text-anchor="middle" fill="#A5F3FC">NumPy-powered</text>
    <rect x="808" y="278" width="150" height="44" rx="22" fill="none" stroke="#818CF8" stroke-width="2"/>
    <text x="883" y="308" text-anchor="middle" fill="#C7D2FE">CPU-fast</text>
  </g>
</svg>
